name: Build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
env:
  PYTHONUTF8: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows, artifact: release/VideoDownloader-windows.zip }
          - { os: macos-latest,   name: mac,     artifact: release/VideoDownloader-mac.zip }
          - { os: ubuntu-22.04,   name: linux,   artifact: release/VideoDownloader-linux.tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk binutils
      - run: pip install -r requirements-build.txt
      - run: python fetch_ffmpeg.py
      - run: pyinstaller --noconfirm --clean VideoDownloader.spec
      - if: matrix.name == 'mac'
        run: codesign --force --deep --sign - dist/VideoDownloader.app || true
      - run: python package.py
      - uses: actions/upload-artifact@v4
        with: { name: "VideoDownloader-${{ matrix.name }}", path: "${{ matrix.artifact }}" }
